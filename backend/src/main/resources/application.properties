spring.application.name=blog-backend
server.port=8080

# ===================================================================
# 数据库与 Druid 连接池配置 (MySQL 8)
# ===================================================================
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_model_hub?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.druid.url=${spring.datasource.url}
spring.datasource.druid.username=${spring.datasource.username}
spring.datasource.druid.password=${spring.datasource.password}
spring.datasource.druid.driver-class-name=${spring.datasource.driver-class-name}

# 连接池调优
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=60000
spring.datasource.druid.time-between-eviction-runs-millis=60000
spring.datasource.druid.min-evictable-idle-time-millis=300000
spring.datasource.druid.validation-query=SELECT 1
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.test-on-borrow=false
spring.datasource.druid.test-on-return=false

# 慢 SQL 监控与 Wall 防护拦截
spring.datasource.druid.filters=stat,wall,slf4j

# ===================================================================
# Flyway 数据库版本迁移
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# 虚拟线程支持
spring.threads.virtual.enabled=true
